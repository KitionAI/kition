<!doctype html>
<!-- The title-case example's panel: the slide file's slide titles and a button that title-cases them.
     One self-contained file: a panel's inline classic scripts run, nothing else loads. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body { padding: 12px 16px 16px; }
  .list { list-style: none; margin: 0 0 12px; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .item { display: flex; gap: 8px; align-items: baseline; padding: 8px 10px; border: 1px solid var(--kit-border, #e5e3df); border-radius: 8px; font-size: 13px; line-height: 1.4; overflow-wrap: anywhere; }
  .number { flex: none; min-width: 1.5em; color: var(--kit-text-muted, #5d5b54); font-variant-numeric: tabular-nums; }
  .empty { margin: 0 0 12px; font-size: 13px; color: var(--kit-text-muted, #5d5b54); }
  .apply { font: inherit; font-size: 13px; font-weight: 500; height: 32px; padding: 0 12px; border: 0; border-radius: var(--kit-radius-control, 8px); background: var(--kit-primary, #5645d4); color: var(--kit-primary-text, #fff); cursor: pointer; }
  .apply:disabled { opacity: 0.5; cursor: default; }
  .apply:focus-visible { outline: 2px solid var(--kit-primary, #5645d4); outline-offset: 2px; }
  .status { margin: 8px 0 0; min-height: 16px; font-size: 12px; color: var(--kit-text-muted, #5d5b54); }
</style>
</head>
<body>
<ol class="list" id="titles" aria-label="Slide titles"></ol>
<p class="empty" id="empty" hidden>This slide file has no slide titles.</p>
<button class="apply" id="apply" type="button">Title case</button>
<p class="status" id="status" role="status"></p>
<script>
  const list = document.getElementById('titles')
  const empty = document.getElementById('empty')
  const apply = document.getElementById('apply')
  const status = document.getElementById('status')

  function show(titles) {
    list.replaceChildren(
      ...titles.map(({ slide, text }) => {
        const item = document.createElement('li')
        item.className = 'item'
        const number = document.createElement('span')
        number.className = 'number'
        number.textContent = String(slide)
        const title = document.createElement('span')
        title.className = 'title'
        title.textContent = text
        item.append(number, title)
        return item
      }),
    )
    empty.hidden = titles.length > 0
  }

  kitionPanel.onMessage((message) => {
    if (message && message.type === 'titles') show(message.titles)
  })
  kitionPanel.request({ type: 'titles' }).then(
    ({ titles }) => show(titles),
    (error) => {
      status.textContent = error.message
    },
  )
  apply.addEventListener('click', async () => {
    apply.disabled = true
    status.textContent = ''
    try {
      const answer = await kitionPanel.request({ type: 'apply' })
      show(answer.titles)
      status.textContent = answer.summary
    } catch (error) {
      status.textContent = error.message
    } finally {
      apply.disabled = false
    }
  })
</script>
</body>
</html>
