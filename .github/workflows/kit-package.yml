name: Kit package

# Builds a kit's package and its headless executables and publishes them in the
# `package-v<version>` Release of the kit's repository (docs/kits.md, section 4b). Each kit
# repository's Package workflow (.github/workflows/package.yml, started by hand) calls it with the
# kit's name, so the Release is made with that repository's own workflow token (contents: write is
# all it needs). Every repository it reads is public.
#
# - plan: what the version (kit.json `version` at the commit the run was started on) still lacks,
#   from the Release's asset names (scripts/kit-release-assets.mjs plan).
# - package: only when the version has no Release yet: scripts/package-kit.sh builds the package
#   and creates the Release with kition-<kit>-<version>.tgz and kition-<kit>-<version>.json.
# - headless: one job per platform whose archive the Release lacks, built and checked as
#   kition-sdk's release builds the published kits' executables (its .github/workflows/release.yml,
#   job `executables`), from the commit the Release was made from: the executable must answer
#   kit.initialize with kit.json's version on its own platform, and is packed into
#   kition-<kit>-<version>-<platform>.tar.gz (kit.json and kition-<kit> at its top).
# - publish-headless: uploads the archives the Release lacks, then, if the Release has none, the
#   index fragment kits-index-<kit>-<version>.json: a kit index (kition-sdk's
#   schemas/kits-index.schema.json) of this kit version with the archives in the Release, at their
#   addresses there. It ends failed, naming them, when a platform built nothing.
#
# An asset is published once and never replaced. Running Package again on a released version
# adds only the headless archives and the fragment its Release lacks, without touching the package:
# that is how a Release made before the headless archives existed is completed, with no new version.

on:
  workflow_call:
    inputs:
      kit:
        description: The kit's name in Kition's kits/modules.json, for example board
        required: true
        type: string

permissions:
  contents: write

env:
  PNPM_VERSION: 10.34.9
  NODE_VERSION: '24'
  WASM_PACK_VERSION: v0.13.1

jobs:
  plan:
    name: Plan ${{ inputs.kit }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      ref: ${{ steps.plan.outputs.ref }}
      package: ${{ steps.plan.outputs.package }}
      platforms: ${{ steps.plan.outputs.platforms }}
      matrix: ${{ steps.plan.outputs.matrix }}
      fragment: ${{ steps.plan.outputs.fragment }}
    steps:
      - name: Check out the kit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: kition-${{ inputs.kit }}

      - name: Check out Kition
        uses: actions/checkout@v7
        with:
          repository: KitionAI/kition
          ref: main
          path: kition

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The headless archives of a released version are built from the commit its Release was
      # made from (the `commit` of its kition-<kit>-<version>.json), so they match its package.
      - name: What the Release lacks
        id: plan
        env:
          KIT: ${{ inputs.kit }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          expected=$(node -e "const kit = require('./kition/kits/modules.json')[process.argv[1]]; if (!kit) process.exit(1); console.log(kit.repository)" "$KIT") \
            || { echo "kits/modules.json has no kit \"$KIT\"" >&2; exit 2; }
          [ "$expected" = "$REPOSITORY" ] || { echo "kit $KIT is published from $expected, not $REPOSITORY" >&2; exit 2; }
          version=$(node -p "require('./kition-$KIT/kit.json').version")
          tag="package-v$version"
          assets=()
          ref="$GITHUB_SHA"
          if gh release view "$tag" --repo "$REPOSITORY" --json assets --jq '.assets[].name' > assets.txt 2> release-error.txt; then
            assets=(--assets assets.txt)
            if grep -qx "kition-$KIT-$version.json" assets.txt; then
              gh release download "$tag" --repo "$REPOSITORY" --pattern "kition-$KIT-$version.json" --output lock-entry.json
              ref=$(node -p "require('./lock-entry.json').commit")
            fi
          elif ! grep -q 'release not found' release-error.txt; then
            cat release-error.txt >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo "ref=$ref"
            node kition/scripts/kit-release-assets.mjs plan --kit "$KIT" --version "$version" "${assets[@]}"
          } | tee -a "$GITHUB_OUTPUT"

  package:
    name: Package ${{ inputs.kit }}
    needs: plan
    if: needs.plan.outputs.package == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # The layout scripts/package-kit.sh expects: the kit, Kition, kition-sdk, kition-tessera and
      # kition-fonts side by side.
      - name: Check out the kit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: kition-${{ inputs.kit }}

      - name: Check out Kition
        uses: actions/checkout@v7
        with:
          repository: KitionAI/kition
          ref: main
          path: kition

      - name: Check out kition-sdk
        uses: actions/checkout@v7
        with:
          repository: KitionAI/kition-sdk
          ref: main
          path: kition-sdk

      - name: Check out kition-tessera
        uses: actions/checkout@v7
        with:
          repository: KitionAI/kition-tessera
          ref: main
          path: kition-tessera

      - name: Check out kition-fonts
        uses: actions/checkout@v7
        with:
          repository: KitionAI/kition-fonts
          ref: main
          path: kition-fonts

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: kition-${{ inputs.kit }} -> target

      - name: Setup wasm-pack
        run: curl -fsSL https://github.com/rustwasm/wasm-pack/releases/download/${WASM_PACK_VERSION}/wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz | tar -xz --strip-components=1 -C "$HOME/.cargo/bin" "wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack"

      # C code in the engines' dependencies (psm's assembly, through loro) is compiled for wasm32
      # with the runner's LLVM.
      - name: Use LLVM for wasm32 C code
        run: |
          llvm="$(ls -d /usr/lib/llvm-*/bin | sort -V | tail -n 1)"
          echo "CC_wasm32_unknown_unknown=$llvm/clang" >> "$GITHUB_ENV"
          echo "AR_wasm32_unknown_unknown=$llvm/llvm-ar" >> "$GITHUB_ENV"

      - name: Build and publish the package
        run: kition/scripts/package-kit.sh "$KIT"
        env:
          KIT: ${{ inputs.kit }}
          GH_TOKEN: ${{ github.token }}

  # The kit's headless executable, built and checked on its own platform as kition-sdk's release
  # builds the published kits' executables (its .github/workflows/release.yml, job `executables`).
  headless:
    name: Headless ${{ inputs.kit }} ${{ matrix.platform }}
    needs: plan
    if: needs.plan.outputs.platforms != '[]'
    strategy:
      # Every platform runs to its end, so one run shows every platform's failure.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      KIT: ${{ inputs.kit }}
      VERSION: ${{ needs.plan.outputs.version }}
      TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.platform }}
      # Linux: the glibc floor, the oldest glibc the executables run on (kition-sdk's
      # docs/sdk/distribution.md). They are linked against it with cargo-zigbuild
      # (<target>.<glibc>), not against the runner's.
      GLIBC: ${{ matrix.glibc }}
      BUILD_TARGET: ${{ matrix.glibc && format('{0}.{1}', matrix.target, matrix.glibc) || matrix.target }}
      CARGO_BUILD: ${{ matrix.glibc && 'zigbuild' || 'build' }}
    steps:
      - name: Check out the kit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
          path: kition-${{ inputs.kit }}

      - name: Check out Kition
        uses: actions/checkout@v7
        with:
          repository: KitionAI/kition
          ref: main
          path: kition

      - name: Check out kition-sdk
        uses: actions/checkout@v7
        with:
          repository: KitionAI/kition-sdk
          ref: main
          path: kition-sdk

      # Beside the kit: the fonts a kit's build embeds when it has no scripts/fetch-fonts.sh (its
      # build reads ../kition-fonts, as in the package job).
      - name: Check out kition-fonts
        uses: actions/checkout@v7
        with:
          repository: KitionAI/kition-fonts
          ref: main
          path: kition-fonts

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - if: matrix.glibc
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - if: matrix.glibc
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: kition-${{ inputs.kit }} -> target
          key: headless-${{ matrix.target }}

      - name: The kit is the version planned
        run: |
          set -euo pipefail
          declared=$(node -p "require('./kition-$KIT/kit.json').version")
          [ "$declared" = "$VERSION" ] || { echo "kition-$KIT kit.json is $declared at ${{ needs.plan.outputs.ref }}; the run publishes $VERSION" >&2; exit 1; }

      # A kit that embeds fonts has scripts/fetch-fonts.sh; one without it embeds the fonts of
      # kition-fonts, or none. A relative path: Git Bash's sha256sum escapes a Windows path's
      # backslashes.
      - name: The kit's fonts
        run: |
          set -euo pipefail
          if [ -f "kition-$KIT/scripts/fetch-fonts.sh" ]; then bash "kition-$KIT/scripts/fetch-fonts.sh" "fonts-$KIT"; fi

      - name: Build the headless executable
        run: |
          set -euo pipefail
          if [ -d "fonts-$KIT" ]; then
            # The fonts folder as the compiler reads paths (D:/a/... on Windows).
            if [ "$RUNNER_OS" = Windows ]; then fonts=$(cd "fonts-$KIT" && pwd -W); else fonts=$(cd "fonts-$KIT" && pwd); fi
            export KITION_FONTS_DIR="$fonts" KITION_FONTS_REQUIRED=1
          fi
          cd "kition-$KIT" && cargo "$CARGO_BUILD" --locked --release -p "kition-$KIT" --target "$BUILD_TARGET"

      # The executable and kit.json, the glibc floor on Linux, what it answers to kit.initialize
      # here (handshakes.json), and the archive (scripts/kit-release-assets.mjs pack checks that
      # answer against kit.json).
      - name: Check and pack the executable
        run: |
          set -euo pipefail
          exe=""; [ "$RUNNER_OS" = Windows ] && exe=".exe"
          out="headless/bin"
          mkdir -p "$out" headless/archive
          cp "kition-$KIT/target/$TARGET/release/kition-$KIT$exe" "$out/"
          cp "kition-$KIT/kit.json" "$out/kit.json"
          if [ -n "$GLIBC" ]; then
            (cd "$out" && node "$GITHUB_WORKSPACE/kition-sdk/tools/glibc-floor.mjs" --max "$GLIBC" "kition-$KIT")
          fi
          node kition-sdk/tools/kit-handshake.mjs --record "$out"
          node kition/scripts/kit-release-assets.mjs pack --kit "$KIT" --platform "$PLATFORM" --dir "$out" --out headless/archive

      - uses: actions/upload-artifact@v7
        with:
          name: headless-${{ matrix.platform }}
          path: headless/archive/*.tar.gz
          if-no-files-found: error

  publish-headless:
    name: Publish ${{ inputs.kit }}'s headless archives
    needs: [plan, package, headless]
    # After the package job made the Release or found it made, and after every platform ran, also
    # when some failed: their archives are published and the run ends failed.
    if: >-
      always() && needs.plan.result == 'success'
      && (needs.package.result == 'success' || needs.package.result == 'skipped')
      && needs.headless.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: kit-package-publish-${{ github.repository }}
      cancel-in-progress: false
    env:
      KIT: ${{ inputs.kit }}
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      PLATFORMS: ${{ needs.plan.outputs.platforms }}
      REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out Kition
        uses: actions/checkout@v7
        with:
          repository: KitionAI/kition
          ref: main
          path: kition

      - name: Check out kition-sdk
        uses: actions/checkout@v7
        with:
          repository: KitionAI/kition-sdk
          ref: main
          path: kition-sdk

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - if: needs.headless.result != 'skipped'
        uses: actions/download-artifact@v8
        with:
          pattern: headless-*
          path: built
          merge-multiple: true

      # gh release upload refuses a name the Release has (no --clobber): an asset is never replaced.
      - name: Upload the archives the Release lacks
        run: |
          set -euo pipefail
          mkdir -p built
          gh release view "$TAG" --repo "$REPOSITORY" --json assets --jq '.assets[].name' > assets.txt
          node kition/scripts/kit-release-assets.mjs publish-plan --kit "$KIT" --version "$VERSION" --assets assets.txt --built built --wanted "$PLATFORMS" > publish-plan.json
          jq -r '.kept[] | "\(.) is in the Release already; the published one stays"' publish-plan.json
          mapfile -t upload < <(jq -r '.upload[] | "built/" + .' publish-plan.json)
          if [ "${#upload[@]}" -gt 0 ]; then
            gh release upload "$TAG" "${upload[@]}" --repo "$REPOSITORY"
            printf 'uploaded %s\n' "${upload[@]}"
          fi

      # The fragment states the archives as the Release holds them (their own size and SHA-256),
      # checked against kition-sdk's kit index schema with kition-sdk's checker.
      - name: The index fragment
        run: |
          set -euo pipefail
          fragment="kits-index-$KIT-$VERSION.json"
          gh release view "$TAG" --repo "$REPOSITORY" --json assets --jq '.assets[].name' > assets.txt
          if ! grep -q "^kition-$KIT-$VERSION-.*\.tar\.gz$" assets.txt; then
            echo "$TAG has no headless archive, so no $fragment"
            exit 0
          fi
          gh release download "$TAG" --repo "$REPOSITORY" --pattern "kition-$KIT-$VERSION-*.tar.gz" --dir released
          if grep -qx "$fragment" assets.txt; then
            gh release download "$TAG" --repo "$REPOSITORY" --pattern "$fragment" --dir published
            missing=$(node kition/scripts/kit-release-assets.mjs compare --kit "$KIT" --version "$VERSION" --archives released --published "published/$fragment")
            if [ -n "$missing" ]; then
              echo "::warning::$fragment was published before the archives of $missing; it is never replaced, so it does not list them"
            else
              echo "$fragment is in the Release already and lists every archive"
            fi
            exit 0
          fi
          node kition/scripts/kit-release-assets.mjs fragment --kit "$KIT" --version "$VERSION" --archives released \
            --base-url "https://github.com/$REPOSITORY/releases/download/$TAG" --out "fragment/$fragment" --sdk kition-sdk
          gh release upload "$TAG" "fragment/$fragment" --repo "$REPOSITORY"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            printf '### %s %s\n\n```json\n%s\n```\n' "$REPOSITORY" "$fragment" "$(cat "fragment/$fragment")" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Every platform built
        run: |
          set -euo pipefail
          failed=$(jq -r '.failed | join(", ")' publish-plan.json)
          if [ -n "$failed" ]; then
            echo "::error::no headless archive for $failed: see the Headless $KIT jobs of those platforms"
            exit 1
          fi
