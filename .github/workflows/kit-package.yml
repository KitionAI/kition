name: Kit package

# Builds a kit version's npm packages and publishes the ones npm lacks (docs/kits.md, section 4b).
# Each kit repository's Package workflow (.github/workflows/package.yml, started by hand) calls it
# with the kit's name and its NPM_TOKEN secret, and grants it `id-token: write` for npm provenance.
# Per kit version (kit.json `version` at the commit the run was started on, which every package is
# built from), the names and contents of kition-sdk's tools/kit-npm.mjs:
#
#   @kition/kit-<kit>-ui                the kit's package (editor, engine, fonts): the folder <kit>-ui/
#   @kition/kit-<kit>-<platform>        kit.json and the headless executable kition-<kit> (.exe on
#                                       Windows), for darwin-arm64, darwin-x64, linux-arm64,
#                                       linux-x64 and win32-x64
#
# each with a `kition` field in its package.json naming the commits it was built from.
#
# The input `scope` (default @kition) is the npm scope, exported to every job as KITION_NPM_SCOPE.
# Any other scope (a rehearsal on @kitionstage) names the packages by layout 1, <scope>/<kit> and
# <scope>/<kit>-<platform>, publishes with the secret NPM_TOKEN_STAGE instead of NPM_TOKEN, and
# asks npmmirror for no copy. The input `platforms` limits a run to the platforms it names.
#
# - plan: the version, what https://registry.npmjs.org lacks of it (kition-sdk's
#   tools/kit-npm-package.mjs missing), and what to build (scripts/kit-package-build.mjs plan). A
#   version is one build: when npm has some of its packages, they must have been built from the
#   run's commit, or the run stops here. Nothing missing, nothing built.
# - package: when the editor package is missing, scripts/package-kit.sh builds the kit's package
#   and packs it with kition-sdk's tool.
# - headless: one job per missing platform, built and checked as kition-sdk's release builds the
#   published kits' executables (its .github/workflows/release.yml, job `executables`): the glibc
#   floor on Linux, and on its own platform the executable must answer kit.initialize with
#   kit.json's id, version and protocol (scripts/kit-package-build.mjs check); then kition-sdk's
#   tool writes the package folder. It is packed in the publish job, on Linux: kition-sdk's `pack`
#   runs npm, which it cannot start on Windows, and the folder travels as a tar, which keeps the
#   executable's mode (an artifact does not).
# - publish: packs the headless folders (kition-sdk's `pack` checks each tarball holds exactly its
#   folder's files), then works in two phases. A: it asks the registry about every tarball
#   (`state`), and a version npm holds with other bytes stops the run before anything is
#   published; then `publish` runs `npm publish --provenance` and `published` (the same bytes)
#   skips it, one tarball after another without waiting. A publish npm refuses because it holds
#   that version already counts as published (an earlier run published it, and npm does not show
#   it yet). B: once every publish returned, it asks the registry every 30 seconds until it shows
#   every package with its bytes (the metadata of that exact version, not npm's placeholder
#   0.0.0-stage, and the tarball with that integrity), for at most VISIBLE_WAIT_MINUTES (40): npm
#   shows a new package name's first version only minutes after its publish (up to 24 for an
#   editor package, measured 2026-11-21). The job summary lists each package: already there, or
#   published and when npm showed it. At the limit the job fails naming the packages npm does not
#   show yet; they were published, and re-running the job publishes nothing again, it only waits
#   for them and checks their bytes (Package started anew builds again what npm does not show yet,
#   and a rebuild whose bytes differ from the published ones stops at the wait with an error). A
#   version on npm is never replaced. Nothing is published unless every package the plan wanted
#   (each missing platform and the editor package) was built: a failed platform or package job
#   skips the publish job, so a version is never half published by a build failure. Running
#   Package again (or re-running the failed jobs) builds only what npm does not show, and publishes
#   only what npm lacks, so a run cut short after some packages were published completes the
#   version.

on:
  workflow_call:
    inputs:
      kit:
        description: The kit's name in Kition's kits/modules.json, for example board
        required: true
        type: string
      platforms:
        description: Build and publish only these platforms (separated by commas, for example darwin-arm64), for a quick rehearsal; empty for every platform
        required: false
        default: ''
        type: string
      scope:
        description: The npm scope of the packages, @kition (legacy names) or another scope such as @kitionstage (layout 1)
        required: false
        default: '@kition'
        type: string
    secrets:
      NPM_TOKEN:
        description: An npm token that may publish the @kition packages
        required: true
      NPM_TOKEN_STAGE:
        description: An npm token that may publish the packages of the scope when it is not @kition
        required: false

permissions:
  contents: read

env:
  PNPM_VERSION: 10.34.9
  NODE_VERSION: '24'
  WASM_PACK_VERSION: v0.13.1
  NPM_REGISTRY: https://registry.npmjs.org/
  # Read by kition-sdk's tools and scripts/lib/kitNpm.mjs, which name the packages by it.
  KITION_NPM_SCOPE: ${{ inputs.scope || '@kition' }}

jobs:
  plan:
    name: Plan ${{ inputs.kit }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
      ui: ${{ steps.plan.outputs.ui }}
      platforms: ${{ steps.plan.outputs.platforms }}
      matrix: ${{ steps.plan.outputs.matrix }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - name: Check out the kit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: kition-${{ inputs.kit }}

      - name: Check out Kition
        uses: actions/checkout@v7
        with:
          repository: KitionAI/kition
          ref: main
          path: kition

      - name: Check out kition-sdk
        uses: actions/checkout@v7
        with:
          repository: KitionAI/kition-sdk
          ref: main
          path: kition-sdk

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: What npm lacks
        id: plan
        env:
          KIT: ${{ inputs.kit }}
          REPOSITORY: ${{ github.repository }}
          ONLY_PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          expected=$(node -e "const kit = require('./kition/kits/modules.json')[process.argv[1]]; if (!kit) process.exit(1); console.log(kit.repository)" "$KIT") \
            || { echo "kits/modules.json has no kit \"$KIT\"" >&2; exit 2; }
          [ "$expected" = "$REPOSITORY" ] || { echo "kit $KIT is published from $expected, not $REPOSITORY" >&2; exit 2; }
          version=$(node -p "require('./kition-$KIT/kit.json').version")
          node kition-sdk/tools/kit-npm-package.mjs missing --kit "$KIT" --version "$version" --registry "$NPM_REGISTRY" > missing.json
          echo "$NPM_REGISTRY lacks of $KIT $version: $(cat missing.json)"
          # A rehearsal may name the platforms it wants (input `platforms`): the others are left out
          # of the plan, so they are neither built nor published.
          if [ -n "$ONLY_PLATFORMS" ]; then
            node -e '
              const fs = require("fs")
              const all = ["darwin-arm64", "darwin-x64", "linux-arm64", "linux-x64", "win32-x64"]
              const only = process.argv[1].split(",").map((name) => name.trim()).filter(Boolean)
              const unknown = only.filter((name) => !all.includes(name))
              if (unknown.length) { console.error(`no platform ${unknown.join(", ")} (${all.join(", ")})`); process.exit(2) }
              const missing = JSON.parse(fs.readFileSync("missing.json", "utf8"))
              missing.platforms = missing.platforms.filter((name) => only.includes(name))
              fs.writeFileSync("missing.json", JSON.stringify(missing))
            ' "$ONLY_PLATFORMS"
            echo "only $ONLY_PLATFORMS: $(cat missing.json)"
          fi
          node kition/scripts/kit-package-build.mjs plan --kit "$KIT" --version "$version" --commit "$GITHUB_SHA" --missing missing.json --registry "$NPM_REGISTRY" > plan.txt
          cat plan.txt >> "$GITHUB_OUTPUT"
          cat plan.txt
          if grep -qx 'build=false' plan.txt; then echo "::notice::npm has every package of $KIT $version; nothing to build"; fi

  package:
    name: Package ${{ inputs.kit }}
    needs: plan
    if: needs.plan.outputs.ui == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # The layout scripts/package-kit.sh expects: the kit (the run's commit), Kition, kition-sdk,
      # kition-tessera and kition-fonts side by side.
      - name: Check out the kit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: kition-${{ inputs.kit }}

      - name: Check out Kition
        uses: actions/checkout@v7
        with:
          repository: KitionAI/kition
          ref: main
          path: kition

      - name: Check out kition-sdk
        uses: actions/checkout@v7
        with:
          repository: KitionAI/kition-sdk
          ref: main
          path: kition-sdk

      - name: Check out kition-tessera
        uses: actions/checkout@v7
        with:
          repository: KitionAI/kition-tessera
          ref: main
          path: kition-tessera

      - name: Check out kition-fonts
        uses: actions/checkout@v7
        with:
          repository: KitionAI/kition-fonts
          ref: main
          path: kition-fonts

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: kition-${{ inputs.kit }} -> target

      - name: Setup wasm-pack
        run: curl -fsSL https://github.com/rustwasm/wasm-pack/releases/download/${WASM_PACK_VERSION}/wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz | tar -xz --strip-components=1 -C "$HOME/.cargo/bin" "wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack"

      # C code in the engines' dependencies (psm's assembly, through loro) is compiled for wasm32
      # with the runner's LLVM.
      - name: Use LLVM for wasm32 C code
        run: |
          llvm="$(ls -d /usr/lib/llvm-*/bin | sort -V | tail -n 1)"
          echo "CC_wasm32_unknown_unknown=$llvm/clang" >> "$GITHUB_ENV"
          echo "AR_wasm32_unknown_unknown=$llvm/llvm-ar" >> "$GITHUB_ENV"

      - name: Build and pack the editor package
        run: kition/scripts/package-kit.sh "$KIT" npm-ui
        env:
          KIT: ${{ inputs.kit }}

      - uses: actions/upload-artifact@v7
        with:
          name: npm-ui
          path: npm-ui/*.tgz
          if-no-files-found: error

  # The kit's headless executable, built and checked on its own platform as kition-sdk's release
  # builds the published kits' executables (its .github/workflows/release.yml, job `executables`).
  headless:
    name: Headless ${{ inputs.kit }} ${{ matrix.platform }}
    needs: plan
    if: needs.plan.outputs.platforms != '[]'
    strategy:
      # Every platform runs to its end, so one run shows every platform's failure.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      KIT: ${{ inputs.kit }}
      VERSION: ${{ needs.plan.outputs.version }}
      TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.platform }}
      # Linux: the glibc floor, the oldest glibc the executables run on (kition-sdk's
      # docs/sdk/distribution.md). They are linked against it with cargo-zigbuild
      # (<target>.<glibc>), not against the runner's.
      GLIBC: ${{ matrix.glibc }}
      BUILD_TARGET: ${{ matrix.glibc && format('{0}.{1}', matrix.target, matrix.glibc) || matrix.target }}
      CARGO_BUILD: ${{ matrix.glibc && 'zigbuild' || 'build' }}
    steps:
      - name: Check out the kit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: kition-${{ inputs.kit }}

      - name: Check out Kition
        uses: actions/checkout@v7
        with:
          repository: KitionAI/kition
          ref: main
          path: kition

      - name: Check out kition-sdk
        uses: actions/checkout@v7
        with:
          repository: KitionAI/kition-sdk
          ref: main
          path: kition-sdk

      # Beside the kit: the fonts a kit's build embeds when it has no scripts/fetch-fonts.sh (its
      # build reads ../kition-fonts, as in the package job).
      - name: Check out kition-fonts
        uses: actions/checkout@v7
        with:
          repository: KitionAI/kition-fonts
          ref: main
          path: kition-fonts

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - if: matrix.glibc
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - if: matrix.glibc
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: kition-${{ inputs.kit }} -> target
          key: headless-${{ matrix.target }}

      - name: The kit is the version planned
        run: |
          set -euo pipefail
          declared=$(node -p "require('./kition-$KIT/kit.json').version")
          [ "$declared" = "$VERSION" ] || { echo "kition-$KIT kit.json is $declared at $GITHUB_SHA; the run publishes $VERSION" >&2; exit 1; }

      # A kit that embeds fonts has scripts/fetch-fonts.sh; one without it embeds the fonts of
      # kition-fonts, or none. A relative path: Git Bash's sha256sum escapes a Windows path's
      # backslashes.
      - name: The kit's fonts
        run: |
          set -euo pipefail
          if [ -f "kition-$KIT/scripts/fetch-fonts.sh" ]; then bash "kition-$KIT/scripts/fetch-fonts.sh" "fonts-$KIT"; fi

      - name: Build the headless executable
        run: |
          set -euo pipefail
          if [ -d "fonts-$KIT" ]; then
            # The fonts folder as the compiler reads paths (D:/a/... on Windows).
            if [ "$RUNNER_OS" = Windows ]; then fonts=$(cd "fonts-$KIT" && pwd -W); else fonts=$(cd "fonts-$KIT" && pwd); fi
            export KITION_FONTS_DIR="$fonts" KITION_FONTS_REQUIRED=1
          fi
          cd "kition-$KIT" && cargo "$CARGO_BUILD" --locked --release -p "kition-$KIT" --target "$BUILD_TARGET"

      # The executable and kit.json, the glibc floor on Linux, what it answers to kit.initialize
      # here (handshakes.json), checked against kit.json (scripts/kit-package-build.mjs check); then
      # the package folder @kition/kit-<kit>-<platform> (kition-sdk's tool, which prints the folder
      # it wrote, named as the package of the scope), as a tar so the executable keeps its mode on
      # the way to the publish job.
      - name: Check the executable and write its package
        run: |
          set -euo pipefail
          exe=""; [ "$RUNNER_OS" = Windows ] && exe=".exe"
          out="headless/bin"
          mkdir -p "$out" headless/npm
          cp "kition-$KIT/target/$TARGET/release/kition-$KIT$exe" "$out/"
          cp "kition-$KIT/kit.json" "$out/kit.json"
          if [ -n "$GLIBC" ]; then
            (cd "$out" && node "$GITHUB_WORKSPACE/kition-sdk/tools/glibc-floor.mjs" --max "$GLIBC" "kition-$KIT")
          fi
          node kition-sdk/tools/kit-handshake.mjs --record "$out"
          node kition/scripts/kit-package-build.mjs check --kit "$KIT" --platform "$PLATFORM" --dir "$out"
          folder=$(node kition-sdk/tools/kit-npm-package.mjs headless --dir "$out" --platform "$PLATFORM" --out headless/npm --commit "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY")
          # The folder's name by Node, which reads a Windows path too.
          name=$(node -e 'console.log(require("path").basename(process.argv[1]))' "$folder")
          tar -cf "headless/kit-$KIT-$PLATFORM.tar" -C headless/npm "$name"

      - uses: actions/upload-artifact@v7
        with:
          name: npm-${{ matrix.platform }}
          path: headless/kit-${{ inputs.kit }}-${{ matrix.platform }}.tar
          if-no-files-found: error

  publish:
    name: Publish ${{ inputs.kit }} on npm
    needs: [plan, package, headless]
    # Only when everything planned was built: the package job built the editor package or was
    # skipped (npm has it), and every platform job built its package or none was planned. A failed
    # or cancelled build publishes nothing, so a version is never half published by it.
    if: >-
      always() && needs.plan.result == 'success' && needs.plan.outputs.build == 'true'
      && (needs.package.result == 'success' || needs.package.result == 'skipped')
      && (needs.headless.result == 'success' || needs.headless.result == 'skipped')
    runs-on: ubuntu-latest
    # The publishes, then at most VISIBLE_WAIT_MINUTES of waiting for npm to show them.
    timeout-minutes: 60
    permissions:
      contents: read
      # npm provenance: the registry checks the run's OIDC token.
      id-token: write
    concurrency:
      group: kit-package-publish-${{ github.repository }}
      cancel-in-progress: false
    env:
      KIT: ${{ inputs.kit }}
      VERSION: ${{ needs.plan.outputs.version }}
      PLATFORMS: ${{ needs.plan.outputs.platforms }}
      UI: ${{ needs.plan.outputs.ui == 'publish' }}
      # How long the job waits, after every publish returned, for npm to show every package with
      # its bytes. npm shows a new package name's first version only after a delay (measured
      # 2026-11-21 on a new scope: a few minutes for a headless package, 12 to 24 for an editor
      # package); until then it shows a placeholder version 0.0.0-stage.
      VISIBLE_WAIT_MINUTES: 40
    steps:
      - name: Check out Kition
        uses: actions/checkout@v7
        with:
          repository: KitionAI/kition
          ref: main
          path: kition

      - name: Check out kition-sdk
        uses: actions/checkout@v7
        with:
          repository: KitionAI/kition-sdk
          ref: main
          path: kition-sdk

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v8
        with:
          pattern: npm-*
          path: built
          merge-multiple: true

      # Each headless folder is packed here (kition-sdk's `pack` checks the tarball holds exactly
      # its files); the editor package arrives packed. packed.jsonl lists every tarball.
      - name: Pack the headless packages
        run: |
          set -euo pipefail
          mkdir -p built folders tarballs
          : > packed.jsonl
          for folder_tar in built/*.tar; do
            [ -e "$folder_tar" ] || continue
            tar -xf "$folder_tar" -C folders
          done
          for folder in folders/*/; do
            [ -d "$folder" ] || continue
            node kition-sdk/tools/kit-npm-package.mjs pack --folder "$folder" --out tarballs >> packed.jsonl
          done
          for tgz in built/*.tgz; do
            [ -e "$tgz" ] || continue
            cp "$tgz" tarballs/
            file="$PWD/tarballs/$(basename "$tgz")"
            tar -xzOf "$file" package/package.json | node -e 'const m = JSON.parse(require("fs").readFileSync(0, "utf8")); console.log(JSON.stringify({ file: process.argv[1], name: m.name, version: m.version }))' "$file" >> packed.jsonl
          done
          cat packed.jsonl
          node kition/scripts/kit-package-build.mjs publish-plan --kit "$KIT" --version "$VERSION" --platforms "$PLATFORMS" --ui "$UI" --packed packed.jsonl > publish-plan.json
          cat publish-plan.json

      # Nothing is published unless every package planned was built (the job's condition already
      # waits for every build job; this also catches a build whose package did not arrive).
      - name: Every package planned was built
        run: |
          set -euo pipefail
          failed=$(jq -r '.failed | join(", ")' publish-plan.json)
          if [ -n "$failed" ]; then
            echo "::error::no package built for $failed (see the jobs of those platforms or the package job); nothing was published. Running Package again, or re-running this run's failed jobs, builds and publishes only what npm lacks"
            exit 1
          fi

      # Phase A: publish every package npm lacks, without waiting for any. `state` is asked for every
      # tarball first and exits 1 when npm holds the version with other bytes, which stops the run
      # before anything is published: a version is published once. `--tag latest` is said outright:
      # npm refuses to move `latest` by itself to a version below one already published, and kition
      # reads the kit index, not the tag. npm refusing a publish because it holds that version
      # already (an earlier run published it and npm does not show it yet, so `state` said
      # `publish`) counts as published; phase B checks its bytes once npm shows it. outcomes.jsonl
      # lists each tarball with what happened to it: published, present (npm had the same bytes)
      # or refused.
      - name: Publish what npm lacks
        env:
          # @kition publishes with NPM_TOKEN; any other scope (a rehearsal) with NPM_TOKEN_STAGE.
          NODE_AUTH_TOKEN: ${{ (inputs.scope || '@kition') == '@kition' && secrets.NPM_TOKEN || secrets.NPM_TOKEN_STAGE }}
        run: |
          set -euo pipefail
          if [ "$KITION_NPM_SCOPE" != '@kition' ] && [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::publishing in $KITION_NPM_SCOPE needs the secret NPM_TOKEN_STAGE, which the calling workflow did not pass" >&2
            exit 1
          fi
          state() { node kition-sdk/tools/kit-npm-package.mjs state --tarball "$1" --registry "$NPM_REGISTRY"; }
          mapfile -t tarballs < <(jq -r '.publish[]' publish-plan.json)
          states=()
          for file in "${tarballs[@]}"; do
            current=$(state "$file")
            states+=("$current")
          done
          : > outcomes.jsonl
          published=()
          for i in "${!tarballs[@]}"; do
            file=${tarballs[$i]}
            name=$(basename "$file")
            case "${states[$i]}" in
              published)
                outcome=present
                echo "$name is on npm already, with the same bytes" ;;
              publish)
                if npm publish "$file" --access public --provenance --tag latest 2>&1 | tee npm-publish.log; then
                  outcome=published
                  published+=("$name")
                  echo "published $name"
                elif grep -qiE 'EPUBLISHCONFLICT|cannot publish over|previously published version' npm-publish.log; then
                  outcome=refused
                  echo "npm holds $name's version already (an earlier run published it); its bytes are checked once npm shows it"
                else
                  echo "::error::npm publish of $name failed (see the log above). Published by this run before it: ${published[*]:-none}. Re-running this job publishes only what npm lacks" >&2
                  exit 1
                fi ;;
              *)
                echo "::error::unexpected state of $name" >&2
                exit 1 ;;
            esac
            jq -c --arg file "$file" --arg outcome "$outcome" 'select(.file == $file) | { file, name, version, outcome: $outcome }' packed.jsonl >> outcomes.jsonl
          done
          cat outcomes.jsonl

      # Phase B: once every publish returned, ask npm every 30 seconds, for at most
      # VISIBLE_WAIT_MINUTES, until it shows every package of the version with its bytes (the
      # metadata of that exact version, not the placeholder 0.0.0-stage, and the tarball with that
      # integrity). A version npm shows with other bytes stops the run. At the limit the step fails
      # naming the packages still pending: they were published, and re-running this job publishes
      # nothing again; it only waits for them and checks their bytes. The job summary lists each
      # package: already there, or published and when npm showed it.
      - name: Wait until npm shows every package
        run: node kition/scripts/kit-package-build.mjs wait --outcomes outcomes.jsonl --registry "$NPM_REGISTRY" --minutes "$VISIBLE_WAIT_MINUTES"

      # npmmirror (registry.npmmirror.com, which kition tries after npmjs.org and which mainland
      # China reaches) copies npmjs.org on its own schedule, which can lag a day for a new package.
      # Asking it to copy the kit's packages now makes them installable there sooner. A refusal is
      # only a warning: kition falls back to npmjs.org. Not for another scope than @kition (a rehearsal).
      - name: Ask npmmirror to copy the packages
        if: (inputs.scope || '@kition') == '@kition'
        continue-on-error: true
        run: |
          for name in $(jq -r '.publish[]' publish-plan.json | xargs -n1 -I{} tar -xzOf {} package/package.json | jq -r .name | sort -u); do
            curl -fsS -X PUT "https://registry-direct.npmmirror.com/-/package/$name/syncs" || echo "::warning::npmmirror did not take the copy request for $name"
            echo
          done
