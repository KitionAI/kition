name: Kit package

# Builds a kit's package and its headless executables and publishes them in the
# `package-v<version>` Release of the kit's repository (docs/kits.md, section 4b). Each kit
# repository's Package workflow (.github/workflows/package.yml, started by hand) calls it with the
# kit's name, so the Release is made with that repository's own workflow token (contents: write is
# all it needs). Every repository it reads is public.
#
# A new version's Release is made once, complete: the package job makes it a draft, the other jobs
# add to the draft, and the publish job publishes it only when it holds every asset. A published
# Release on a repository with GitHub's immutable releases can gain no asset (HTTP 422), and a draft
# can, so this is the one order that works on every repository.
#
# - plan: the version (kit.json `version` at the commit the run was started on), its Release's
#   state (none, draft, published; immutable or not) and what it lacks
#   (scripts/kit-release-assets.mjs plan), and the commit to build from
#   (scripts/kit-release-assets.mjs ref): the run's for a new version, the target of the draft, or
#   the commit of the published Release's tag, which its lock entry, when it has one, must name. A
#   published immutable Release that lacks an archive or the fragment stops the run here, before
#   anything is built: it cannot gain assets, so the kit's version is bumped instead.
# - package: when there is no Release, or a draft without both package files:
#   scripts/package-kit.sh builds the package and makes the draft (targeting the built commit) with
#   kition-<kit>-<version>.tgz and kition-<kit>-<version>.json, or puts both into the draft again.
# - headless: one job per platform whose archive the Release lacks, built and checked as
#   kition-sdk's release builds the published kits' executables (its .github/workflows/release.yml,
#   job `executables`), from the commit planned: the executable must answer kit.initialize with
#   kit.json's version on its own platform, and is packed into
#   kition-<kit>-<version>-<platform>.tar.gz (kit.json and kition-<kit> at its top).
# - publish: uploads the archives the Release lacks; then, if it has no index fragment
#   kits-index-<kit>-<version>.json yet (and, for a draft, once it has every platform's archive),
#   writes it: a kit index (kition-sdk's schemas/kits-index.schema.json) of this kit version with
#   the archives in the Release at their public addresses
#   (https://github.com/<repository>/releases/download/<tag>/<archive>), with the size and SHA-256
#   of the bytes this job uploaded (a draft's assets are not at that address until it is
#   published). Last, a draft that holds every asset is published. A draft that does not stays a
#   draft and the run ends failed, naming what it lacks: re-running the run's failed jobs (or
#   running Package again) builds the rest into the same draft and publishes it. This holds on
#   every repository, immutable or not, so a published Release is always complete.
#
# An asset of a published Release is never replaced. Running Package again on a published version
# of a repository without immutable releases adds only the headless archives and the fragment its
# Release lacks, without touching the package: that is how a Release made before the headless
# archives existed is completed, with no new version. A published Release whose lock entry (.json)
# is missing is completed too; one without its package (.tgz) is refused.

on:
  workflow_call:
    inputs:
      kit:
        description: The kit's name in Kition's kits/modules.json, for example board
        required: true
        type: string

permissions:
  contents: write

env:
  PNPM_VERSION: 10.34.9
  NODE_VERSION: '24'
  WASM_PACK_VERSION: v0.13.1

jobs:
  plan:
    name: Plan ${{ inputs.kit }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
      ref: ${{ steps.plan.outputs.ref }}
      package: ${{ steps.plan.outputs.package }}
      platforms: ${{ steps.plan.outputs.platforms }}
      matrix: ${{ steps.plan.outputs.matrix }}
      fragment: ${{ steps.plan.outputs.fragment }}
    steps:
      - name: Check out the kit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: kition-${{ inputs.kit }}

      - name: Check out Kition
        uses: actions/checkout@v7
        with:
          repository: KitionAI/kition
          ref: main
          path: kition

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # gh finds a draft by its tag name too, although its tag is made only when it is published.
      - name: What the Release lacks
        id: plan
        env:
          KIT: ${{ inputs.kit }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          expected=$(node -e "const kit = require('./kition/kits/modules.json')[process.argv[1]]; if (!kit) process.exit(1); console.log(kit.repository)" "$KIT") \
            || { echo "kits/modules.json has no kit \"$KIT\"" >&2; exit 2; }
          [ "$expected" = "$REPOSITORY" ] || { echo "kit $KIT is published from $expected, not $REPOSITORY" >&2; exit 2; }
          version=$(node -p "require('./kition-$KIT/kit.json').version")
          tag="package-v$version"
          release=none
          plan_args=()
          if gh release view "$tag" --repo "$REPOSITORY" --json isDraft,isImmutable,targetCommitish,assets > release.json 2> release-error.txt; then
            jq -r '.assets[].name' release.json > assets.txt
            plan_args=(--assets assets.txt)
            release=published
            if [ "$(jq -r .isDraft release.json)" = true ]; then release=draft; plan_args+=(--draft); fi
            if [ "$(jq -r .isImmutable release.json)" = true ]; then plan_args+=(--immutable); fi
          elif ! grep -q 'release not found' release-error.txt; then
            cat release-error.txt >&2
            exit 1
          fi
          node kition/scripts/kit-release-assets.mjs plan --kit "$KIT" --version "$version" "${plan_args[@]}" > plan.txt
          ref_args=(--release "$release" --run "$GITHUB_SHA")
          case "$release" in
            draft) ref_args+=(--target "$(jq -r .targetCommitish release.json)") ;;
            published) ref_args+=(--tag-commit "$(gh api "repos/$REPOSITORY/commits/$tag" --jq .sha)") ;;
          esac
          if [ "$release" != none ] && grep -qx "kition-$KIT-$version.json" assets.txt; then
            gh release download "$tag" --repo "$REPOSITORY" --pattern "kition-$KIT-$version.json" --output lock-entry.json
            ref_args+=(--lock-entry lock-entry.json)
          fi
          ref=$(node kition/scripts/kit-release-assets.mjs ref "${ref_args[@]}")
          {
            echo "version=$version"
            echo "ref=$ref"
            cat plan.txt
          } | tee -a "$GITHUB_OUTPUT"

  package:
    name: Package ${{ inputs.kit }}
    needs: plan
    if: needs.plan.outputs.package == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # The layout scripts/package-kit.sh expects: the kit (the commit planned: the run's, or the
      # draft's target), Kition, kition-sdk, kition-tessera and kition-fonts side by side.
      - name: Check out the kit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
          path: kition-${{ inputs.kit }}

      - name: Check out Kition
        uses: actions/checkout@v7
        with:
          repository: KitionAI/kition
          ref: main
          path: kition

      - name: Check out kition-sdk
        uses: actions/checkout@v7
        with:
          repository: KitionAI/kition-sdk
          ref: main
          path: kition-sdk

      - name: Check out kition-tessera
        uses: actions/checkout@v7
        with:
          repository: KitionAI/kition-tessera
          ref: main
          path: kition-tessera

      - name: Check out kition-fonts
        uses: actions/checkout@v7
        with:
          repository: KitionAI/kition-fonts
          ref: main
          path: kition-fonts

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: kition-${{ inputs.kit }} -> target

      - name: Setup wasm-pack
        run: curl -fsSL https://github.com/rustwasm/wasm-pack/releases/download/${WASM_PACK_VERSION}/wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz | tar -xz --strip-components=1 -C "$HOME/.cargo/bin" "wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack"

      # C code in the engines' dependencies (psm's assembly, through loro) is compiled for wasm32
      # with the runner's LLVM.
      - name: Use LLVM for wasm32 C code
        run: |
          llvm="$(ls -d /usr/lib/llvm-*/bin | sort -V | tail -n 1)"
          echo "CC_wasm32_unknown_unknown=$llvm/clang" >> "$GITHUB_ENV"
          echo "AR_wasm32_unknown_unknown=$llvm/llvm-ar" >> "$GITHUB_ENV"

      - name: Build the package into the draft Release
        run: kition/scripts/package-kit.sh "$KIT"
        env:
          KIT: ${{ inputs.kit }}
          GH_TOKEN: ${{ github.token }}

  # The kit's headless executable, built and checked on its own platform as kition-sdk's release
  # builds the published kits' executables (its .github/workflows/release.yml, job `executables`).
  headless:
    name: Headless ${{ inputs.kit }} ${{ matrix.platform }}
    needs: plan
    if: needs.plan.outputs.platforms != '[]'
    strategy:
      # Every platform runs to its end, so one run shows every platform's failure.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      KIT: ${{ inputs.kit }}
      VERSION: ${{ needs.plan.outputs.version }}
      TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.platform }}
      # Linux: the glibc floor, the oldest glibc the executables run on (kition-sdk's
      # docs/sdk/distribution.md). They are linked against it with cargo-zigbuild
      # (<target>.<glibc>), not against the runner's.
      GLIBC: ${{ matrix.glibc }}
      BUILD_TARGET: ${{ matrix.glibc && format('{0}.{1}', matrix.target, matrix.glibc) || matrix.target }}
      CARGO_BUILD: ${{ matrix.glibc && 'zigbuild' || 'build' }}
    steps:
      - name: Check out the kit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
          path: kition-${{ inputs.kit }}

      - name: Check out Kition
        uses: actions/checkout@v7
        with:
          repository: KitionAI/kition
          ref: main
          path: kition

      - name: Check out kition-sdk
        uses: actions/checkout@v7
        with:
          repository: KitionAI/kition-sdk
          ref: main
          path: kition-sdk

      # Beside the kit: the fonts a kit's build embeds when it has no scripts/fetch-fonts.sh (its
      # build reads ../kition-fonts, as in the package job).
      - name: Check out kition-fonts
        uses: actions/checkout@v7
        with:
          repository: KitionAI/kition-fonts
          ref: main
          path: kition-fonts

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - if: matrix.glibc
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - if: matrix.glibc
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: kition-${{ inputs.kit }} -> target
          key: headless-${{ matrix.target }}

      - name: The kit is the version planned
        run: |
          set -euo pipefail
          declared=$(node -p "require('./kition-$KIT/kit.json').version")
          [ "$declared" = "$VERSION" ] || { echo "kition-$KIT kit.json is $declared at ${{ needs.plan.outputs.ref }}; the run publishes $VERSION" >&2; exit 1; }

      # A kit that embeds fonts has scripts/fetch-fonts.sh; one without it embeds the fonts of
      # kition-fonts, or none. A relative path: Git Bash's sha256sum escapes a Windows path's
      # backslashes.
      - name: The kit's fonts
        run: |
          set -euo pipefail
          if [ -f "kition-$KIT/scripts/fetch-fonts.sh" ]; then bash "kition-$KIT/scripts/fetch-fonts.sh" "fonts-$KIT"; fi

      - name: Build the headless executable
        run: |
          set -euo pipefail
          if [ -d "fonts-$KIT" ]; then
            # The fonts folder as the compiler reads paths (D:/a/... on Windows).
            if [ "$RUNNER_OS" = Windows ]; then fonts=$(cd "fonts-$KIT" && pwd -W); else fonts=$(cd "fonts-$KIT" && pwd); fi
            export KITION_FONTS_DIR="$fonts" KITION_FONTS_REQUIRED=1
          fi
          cd "kition-$KIT" && cargo "$CARGO_BUILD" --locked --release -p "kition-$KIT" --target "$BUILD_TARGET"

      # The executable and kit.json, the glibc floor on Linux, what it answers to kit.initialize
      # here (handshakes.json), and the archive (scripts/kit-release-assets.mjs pack checks that
      # answer against kit.json).
      - name: Check and pack the executable
        run: |
          set -euo pipefail
          exe=""; [ "$RUNNER_OS" = Windows ] && exe=".exe"
          out="headless/bin"
          mkdir -p "$out" headless/archive
          cp "kition-$KIT/target/$TARGET/release/kition-$KIT$exe" "$out/"
          cp "kition-$KIT/kit.json" "$out/kit.json"
          if [ -n "$GLIBC" ]; then
            (cd "$out" && node "$GITHUB_WORKSPACE/kition-sdk/tools/glibc-floor.mjs" --max "$GLIBC" "kition-$KIT")
          fi
          node kition-sdk/tools/kit-handshake.mjs --record "$out"
          node kition/scripts/kit-release-assets.mjs pack --kit "$KIT" --platform "$PLATFORM" --dir "$out" --out headless/archive

      - uses: actions/upload-artifact@v7
        with:
          name: headless-${{ matrix.platform }}
          path: headless/archive/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish ${{ inputs.kit }}'s Release
    needs: [plan, package, headless]
    # After the package job made the draft or found the package there, and after every platform
    # ran, also when some failed: their archives go into the Release and the run ends failed.
    if: >-
      always() && needs.plan.result == 'success'
      && (needs.package.result == 'success' || needs.package.result == 'skipped')
      && needs.headless.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: kit-package-publish-${{ github.repository }}
      cancel-in-progress: false
    env:
      KIT: ${{ inputs.kit }}
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      PLATFORMS: ${{ needs.plan.outputs.platforms }}
      REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out Kition
        uses: actions/checkout@v7
        with:
          repository: KitionAI/kition
          ref: main
          path: kition

      - name: Check out kition-sdk
        uses: actions/checkout@v7
        with:
          repository: KitionAI/kition-sdk
          ref: main
          path: kition-sdk

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - if: needs.headless.result != 'skipped'
        uses: actions/download-artifact@v8
        with:
          pattern: headless-*
          path: built
          merge-multiple: true

      # gh release upload refuses a name the Release has (no --clobber): an asset is never replaced.
      - name: Upload the archives the Release lacks
        run: |
          set -euo pipefail
          mkdir -p built
          gh release view "$TAG" --repo "$REPOSITORY" --json assets --jq '.assets[].name' > assets.txt
          node kition/scripts/kit-release-assets.mjs publish-plan --kit "$KIT" --version "$VERSION" --assets assets.txt --built built --wanted "$PLATFORMS" > publish-plan.json
          jq -r '.kept[] | "\(.) is in the Release already; the one there stays"' publish-plan.json
          mapfile -t upload < <(jq -r '.upload[] | "built/" + .' publish-plan.json)
          if [ "${#upload[@]}" -gt 0 ]; then
            gh release upload "$TAG" "${upload[@]}" --repo "$REPOSITORY"
            printf 'uploaded %s\n' "${upload[@]}"
          fi

      # The fragment states the archives as the Release holds them (their size and SHA-256), at
      # their public addresses, checked against kition-sdk's kit index schema with kition-sdk's
      # checker. An archive this job uploaded is read from its own bytes; one the Release had before
      # (a published Release's, or one an earlier attempt put into the draft) is downloaded with gh,
      # which reads a draft's assets through the API.
      - name: The index fragment
        run: |
          set -euo pipefail
          fragment="kits-index-$KIT-$VERSION.json"
          gh release view "$TAG" --repo "$REPOSITORY" --json isDraft,assets > release.json
          jq -r '.assets[].name' release.json > assets.txt
          mapfile -t archives < <(grep "^kition-$KIT-$VERSION-.*\.tar\.gz$" assets.txt || true)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "$TAG has no headless archive, so no $fragment"
            exit 0
          fi
          lacking=$(node kition/scripts/kit-release-assets.mjs missing --kit "$KIT" --version "$VERSION" --assets assets.txt | tr ' ' '\n' | grep '\.tar\.gz$' | paste -sd ' ' - || true)
          if [ "$(jq -r .isDraft release.json)" = true ] && [ -n "$lacking" ]; then
            echo "the draft $TAG lacks $lacking, so no $fragment yet: it is written once every platform's archive is in"
            exit 0
          fi
          mkdir -p released
          for name in "${archives[@]}"; do
            if jq -e --arg name "$name" '.upload | index($name)' publish-plan.json > /dev/null; then
              cp "built/$name" released/
            else
              gh release download "$TAG" --repo "$REPOSITORY" --pattern "$name" --dir released
            fi
          done
          if grep -qx "$fragment" assets.txt; then
            gh release download "$TAG" --repo "$REPOSITORY" --pattern "$fragment" --dir published
            missing=$(node kition/scripts/kit-release-assets.mjs compare --kit "$KIT" --version "$VERSION" --archives released --published "published/$fragment")
            if [ -n "$missing" ]; then
              echo "::warning::$fragment was published before the archives of $missing; it is never replaced, so it does not list them"
            else
              echo "$fragment is in the Release already and lists every archive"
            fi
            exit 0
          fi
          node kition/scripts/kit-release-assets.mjs fragment --kit "$KIT" --version "$VERSION" --archives released \
            --base-url "https://github.com/$REPOSITORY/releases/download/$TAG" --out "fragment/$fragment" --sdk kition-sdk
          gh release upload "$TAG" "fragment/$fragment" --repo "$REPOSITORY"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            printf '### %s %s\n\n```json\n%s\n```\n' "$REPOSITORY" "$fragment" "$(cat "fragment/$fragment")" >> "$GITHUB_STEP_SUMMARY"
          fi

      # A draft is published once it holds every asset, and stays a draft until then; a published
      # Release's run ends failed when a platform built nothing.
      - name: Publish the draft once it is complete
        run: |
          set -euo pipefail
          failed=$(jq -r '.failed | join(", ")' publish-plan.json)
          gh release view "$TAG" --repo "$REPOSITORY" --json isDraft,assets > release.json
          jq -r '.assets[].name' release.json > assets.txt
          if [ "$(jq -r .isDraft release.json)" = true ]; then
            missing=$(node kition/scripts/kit-release-assets.mjs missing --kit "$KIT" --version "$VERSION" --assets assets.txt)
            if [ -n "$missing" ]; then
              [ -z "$failed" ] || echo "::error::no headless archive for $failed: see the Headless $KIT jobs of those platforms"
              echo "::error::$TAG stays a draft: it lacks $missing. Re-run this run's failed jobs (or run Package again) to build them into the draft; it is published once it holds every asset"
              exit 1
            fi
            gh release edit "$TAG" --repo "$REPOSITORY" --draft=false
            gh release view "$TAG" --repo "$REPOSITORY" --json isDraft,url --jq 'if .isDraft then error("still a draft") else "published \(.url)" end'
            fragment="fragment/kits-index-$KIT-$VERSION.json"
            if [ -f "$fragment" ]; then
              for url in $(jq -r '.kits[].versions[].platforms[].url' "$fragment"); do
                curl -fsSIL -o /dev/null "$url" || echo "::warning::$url does not answer yet"
              done
            fi
          fi
          if [ -n "$failed" ]; then
            echo "::error::no headless archive for $failed: see the Headless $KIT jobs of those platforms"
            exit 1
          fi
