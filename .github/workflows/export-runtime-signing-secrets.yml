name: Export Runtime Signing Secrets

on:
  workflow_dispatch:
    inputs:
      recipient_public_key:
        description: Base64 libsodium public key for one-time encrypted export
        required: true
        type: string

permissions:
  contents: read

jobs:
  export:
    if: github.actor == 'allentatakai' && github.repository == 'KitionAI/kition'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Install sealed-box support
        run: python3 -m pip install --disable-pip-version-check pynacl

      - name: Encrypt runtime signing secrets
        shell: bash
        env:
          RECIPIENT_PUBLIC_KEY: ${{ inputs.recipient_public_key }}
          MACOS_CSC_P12_BASE64: ${{ secrets.MACOS_CSC_P12_BASE64 }}
          MACOS_CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          from nacl.public import PublicKey, SealedBox

          public_key = PublicKey(base64.b64decode(os.environ['RECIPIENT_PUBLIC_KEY']))
          box = SealedBox(public_key)
          output_dir = Path('encrypted-runtime-signing-secrets')
          output_dir.mkdir()
          for name in ('MACOS_CSC_P12_BASE64', 'MACOS_CSC_KEY_PASSWORD'):
              value = os.environ.get(name, '')
              if not value:
                  raise SystemExit(f'{name} is required')
              encrypted = base64.b64encode(box.encrypt(value.encode())).decode()
              (output_dir / f'{name}.json').write_text(
                  json.dumps({'encrypted_value': encrypted}) + '\n',
                  encoding='utf-8',
              )
          PY

      - name: Upload encrypted secrets
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-runtime-signing-secrets
          path: encrypted-runtime-signing-secrets/*.json
          if-no-files-found: error
          retention-days: 1
