name: Kit CI

# Tests one kit on GitHub-hosted runners. Each kit's .github/workflows/ci.yml calls it (written
# by scripts/kit-ci-install.mjs); scripts/kit-ci.sh drives it from a developer's machine (push a
# commit to the kit's ci/agent branch, wait, read the failures, land it on main). See docs/kits.md.
#
# Jobs:
# - plan: the kit's test jobs (scripts/kit-ci-plan.mjs: one per `test`/`test:*` script), and
#   whether the change is text-only (below).
# - build: the WebAssembly engine and the editor build, shared with the test jobs as the
#   artifact `engine`.
# - rust: fmt, clippy and `cargo test --workspace`, each run to the end so one run reports every
#   failure; then, when they pass, the kit's `cargo xtask ci` (its layer, wasm and asset checks).
# - test: one job per test script, at most `max_parallel` at once (6 unless the kit's
#   .github/kit-ci.json says otherwise), so a kit's run holds at most 8 of the organization's
#   concurrent jobs. A failed job uploads its test-results and playwright-report as
#   `evidence-<job>`.
#
# Text-only path: a push to ci/** or a pull request whose files, against the merge base with main,
# are all on the text-only list in scripts/kit-ci-plan.mjs (Markdown at the root, directly in
# .github/ and under docs/ outside attribution.md, parity/ and features/; .claude/; LICENSE* and
# NOTICE* at the root; .github/CODEOWNERS and .github/ISSUE_TEMPLATE/) skips build, rust and test.
# The `Text only` job checks the files instead (UTF-8 text, `git diff --check`) and the run ends
# green in about a minute. An empty change, any other file (a case's .yaml, a comment in a .rs),
# the nightly run and a run started by hand (`scripts/kit-ci.sh push <kit> --full`) take the full run.
#
# Runner pools. GitHub Free gives an organization 20 concurrent jobs, and a run counts against the
# organization that owns the repository it runs in. A runner pool is another organization with one
# public repository written by scripts/kit-ci-runner-repo.mjs: one workflow per kit
# (`on: workflow_dispatch` with the input `sha`) that calls this workflow with
# `repository: KitionAI/kition-<kit>` and `ref: <sha>`, so the jobs run on the pool's 20 and test
# the kit's commit. Without those inputs (every kit's own ci.yml) this workflow tests the calling
# repository's commit, as before. A pool run is always a full run: scripts/kit-ci.sh decides
# text-only on the developer's machine and keeps such a change at home. Everything a pool run reads
# is public (the kit, kition-sdk, kition-tessera, kition-fonts, this workflow and the kit-checkout
# action at main), so the pool repository's own GITHUB_TOKEN is enough: no step needs a secret or a
# KitionAI permission. Every run names what it tested: the line `kit-ci-tested <repository>@<sha>`
# in the plan job's log, the summary's first heading, and the artifact `tested` (tested.json:
# repository, sha, kit), which `scripts/kit-ci.sh land` checks before it lands a pool run.
# The Rust caches of a pool run carry the kit's name (a pool repository holds all 16 kits' caches);
# artifacts belong to their run, so their names need none. scripts/kit-ci.sh, docs/kits.md and
# scripts/kit-ci-pools.json say how the driver picks a pool and how to add one.

on:
  workflow_call:
    inputs:
      kit:
        description: The kit's name, for example photo (its repository is kition-<kit>)
        required: true
        type: string
      repository:
        description: >-
          The kit repository to test (owner/name). Empty: the calling repository. A runner pool
          sets it to KitionAI/kition-<kit>, with `ref`.
        required: false
        type: string
        default: ''
      ref:
        description: >-
          The commit to test, a full 40-character SHA; needed with `repository`. Empty: the commit
          that started the run.
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  KIT: ${{ inputs.kit }}
  # The repository under test: the calling one, or the kit a runner pool names.
  KIT_REPOSITORY: ${{ inputs.repository || github.repository }}
  WASM_PACK_VERSION: v0.13.1

# Ubuntu 24.04: Playwright 1.59 has no browsers for ubuntu-latest (26.04).
jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      max_parallel: ${{ steps.plan.outputs.max_parallel }}
      xtask: ${{ steps.plan.outputs.xtask }}
      text_only: ${{ steps.plan.outputs.text_only }}
      base: ${{ steps.base.outputs.base }}
      head: ${{ steps.base.outputs.head }}
    steps:
      - name: Check the inputs
        env:
          INPUT_REPOSITORY: ${{ inputs.repository }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_REF" ] && ! [[ "$INPUT_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::ref must be a full commit SHA (40 lowercase hex characters), not '$INPUT_REF'"
            exit 1
          fi
          if [ -n "$INPUT_REPOSITORY" ] && [ -z "$INPUT_REF" ]; then
            echo "::error::a run for another repository ($INPUT_REPOSITORY) needs ref, the commit to test"
            exit 1
          fi

      - name: Check out the kit
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          path: kition-${{ inputs.kit }}

      # What this run tests, in three places: a log line, the summary's first heading, and the
      # artifact `tested` that scripts/kit-ci.sh land checks for a runner-pool run.
      - name: Name the commit under test
        run: |
          set -euo pipefail
          tested="$(git -C "kition-$KIT" rev-parse HEAD)"
          echo "kit-ci-tested $KIT_REPOSITORY@$tested"
          echo "### Testing [$KIT_REPOSITORY@${tested:0:12}]($GITHUB_SERVER_URL/$KIT_REPOSITORY/commit/$tested)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Run in \`$GITHUB_REPOSITORY\` for the commit \`$tested\` of \`$KIT_REPOSITORY\`." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$RUNNER_TEMP/tested"
          printf '{"repository":"%s","sha":"%s","kit":"%s","run":"%s/%s"}\n' "$KIT_REPOSITORY" "$tested" "$KIT" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/tested/tested.json"

      - name: Upload the proof of what was tested
        uses: actions/upload-artifact@v7
        with:
          name: tested
          path: ${{ runner.temp }}/tested/tested.json
          retention-days: 30
          if-no-files-found: error

      - name: Check out Kition's scripts
        uses: actions/checkout@v7
        with:
          repository: KitionAI/kition
          ref: main
          path: kition
          sparse-checkout: scripts

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # The merge base with main (a push) or with the pull request's base. Nightly and hand-started
      # runs get none, so they always test everything; so does a runner-pool run (another
      # repository: the driver decided text-only before it dispatched) and any failure here.
      - name: Find the merge base with main
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ inputs.repository == '' && github.event_name || 'runner-pool' }}
          REPO: ${{ inputs.repository || github.repository }}
          SHA: ${{ inputs.ref || github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          base=""
          head="$SHA"
          case "$EVENT" in
            push) base="$(gh api "repos/$REPO/compare/main...$SHA" -q .merge_base_commit.sha)" || base="" ;;
            pull_request) head="$PR_HEAD"; base="$(gh api "repos/$REPO/compare/$PR_BASE...$PR_HEAD" -q .merge_base_commit.sha)" || base="" ;;
          esac
          if [ -n "$base" ] && ! git -C "kition-$KIT" fetch --quiet --no-tags --depth=1 origin "$base" "$head"; then
            echo "could not fetch $base and $head: full run"
            base=""
          fi
          echo "event $EVENT, base ${base:-none}, head $head"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - name: List the test jobs
        id: plan
        env:
          BASE: ${{ steps.base.outputs.base }}
          HEAD_SHA: ${{ steps.base.outputs.head }}
        run: |
          set -euo pipefail
          args=(--github-output --summary "$GITHUB_STEP_SUMMARY")
          if [ -n "$BASE" ]; then args+=(--base "$BASE" --head "$HEAD_SHA"); fi
          node kition/scripts/kit-ci-plan.mjs "kition-$KIT" "${args[@]}" | tee -a "$GITHUB_OUTPUT"

  text:
    name: Text only
    needs: plan
    if: needs.plan.outputs.text_only == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the kit
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          path: kition-${{ inputs.kit }}

      - name: Check out Kition's scripts
        uses: actions/checkout@v7
        with:
          repository: KitionAI/kition
          ref: main
          path: kition
          sparse-checkout: scripts

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Check the changed text
        env:
          BASE: ${{ needs.plan.outputs.base }}
          HEAD_SHA: ${{ needs.plan.outputs.head }}
        run: |
          set -euo pipefail
          git -C "kition-$KIT" fetch --quiet --no-tags --depth=1 origin "$BASE" "$HEAD_SHA"
          node kition/scripts/kit-ci-plan.mjs "kition-$KIT" --check-text --base "$BASE" --head "$HEAD_SHA" --summary "$GITHUB_STEP_SUMMARY"

  build:
    name: Build
    needs: plan
    if: needs.plan.outputs.text_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: KitionAI/kition/.github/actions/kit-checkout@main
        with:
          kit: ${{ inputs.kit }}
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # A runner pool's repository holds all 16 kits' caches, so its keys carry the kit's name
      # (else one kit could restore another's target/); a kit's own repository keeps its keys.
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: kition-${{ inputs.kit }} -> target
          key: ${{ inputs.repository != '' && inputs.kit || '' }}

      - name: Setup wasm-pack
        run: curl -fsSL https://github.com/rustwasm/wasm-pack/releases/download/${WASM_PACK_VERSION}/wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz | tar -xz --strip-components=1 -C "$HOME/.cargo/bin" "wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack"

      # C code in the engines' dependencies (psm's assembly, through loro) is compiled for wasm32
      # with the runner's LLVM.
      - name: Use LLVM for wasm32 C code
        run: |
          llvm="$(ls -d /usr/lib/llvm-*/bin | sort -V | tail -n 1)"
          echo "CC_wasm32_unknown_unknown=$llvm/clang" >> "$GITHUB_ENV"
          echo "AR_wasm32_unknown_unknown=$llvm/llvm-ar" >> "$GITHUB_ENV"

      - name: Install the editor's dependencies
        run: pnpm --dir "kition-$KIT/web" install --frozen-lockfile

      - name: Build the engine
        run: pnpm --dir "kition-$KIT/web" run engine

      - name: Build the editor
        run: pnpm --dir "kition-$KIT/web" run build

      - name: Share the engine and the build
        uses: actions/upload-artifact@v7
        with:
          name: engine
          path: |
            kition-${{ inputs.kit }}/web/public/engine/
            kition-${{ inputs.kit }}/web/public/fonts/
            kition-${{ inputs.kit }}/web/dist/
            kition-${{ inputs.kit }}/engine/
          retention-days: 3
          if-no-files-found: error

  rust:
    name: Rust
    needs: plan
    if: needs.plan.outputs.text_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: KitionAI/kition/.github/actions/kit-checkout@main
        with:
          kit: ${{ inputs.kit }}
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          pnpm-cache: 'false'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      # A runner pool's repository holds all 16 kits' caches, so its keys carry the kit's name
      # (else one kit could restore another's target/); a kit's own repository keeps its keys.
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: kition-${{ inputs.kit }} -> target
          key: ${{ inputs.repository != '' && inputs.kit || '' }}

      - name: Use LLVM for wasm32 C code
        run: |
          llvm="$(ls -d /usr/lib/llvm-*/bin | sort -V | tail -n 1)"
          echo "CC_wasm32_unknown_unknown=$llvm/clang" >> "$GITHUB_ENV"
          echo "AR_wasm32_unknown_unknown=$llvm/llvm-ar" >> "$GITHUB_ENV"

      # fmt, clippy and the tests run as separate steps that each finish (--keep-going,
      # --no-fail-fast), so one run reports every failure; then the kit's own `cargo xtask ci`
      # adds its other checks (layers, wasm, assets), reusing the build.
      - name: cargo fmt
        working-directory: kition-${{ inputs.kit }}
        run: cargo fmt --all -- --check

      - name: cargo clippy
        if: ${{ !cancelled() }}
        working-directory: kition-${{ inputs.kit }}
        run: cargo clippy --workspace --all-targets --keep-going -- -D warnings

      - name: cargo test
        if: ${{ !cancelled() }}
        working-directory: kition-${{ inputs.kit }}
        run: cargo test --workspace --no-fail-fast

      - name: cargo xtask ci
        if: needs.plan.outputs.xtask == 'true'
        working-directory: kition-${{ inputs.kit }}
        run: cargo xtask ci

  test:
    name: ${{ matrix.name }}
    needs: [plan, build]
    if: needs.plan.outputs.text_only != 'true' && needs.plan.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Playwright's WebKit reports a Mac navigator.platform on Linux unless this is set, so editors
      # would expect Cmd shortcuts while the tests (and real Linux users) press Ctrl.
      PLAYWRIGHT_NO_UA_PLATFORM: '1'
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out
        uses: KitionAI/kition/.github/actions/kit-checkout@main
        with:
          kit: ${{ inputs.kit }}
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}

      - name: Get the engine and the build
        uses: actions/download-artifact@v7
        with:
          name: engine
          path: kition-${{ inputs.kit }}

      - name: Install dependencies
        env:
          DIR: ${{ matrix.dir }}
        run: |
          set -euo pipefail
          pnpm --dir "kition-$KIT/web" install --frozen-lockfile
          if [ "$DIR" != web ]; then pnpm --dir "kition-$KIT/$DIR" install --frozen-lockfile; fi

      - name: Does the kit use Playwright
        id: playwright
        working-directory: kition-${{ inputs.kit }}/web
        run: |
          version="$(node -p "const p = require('./package.json'); const d = { ...p.dependencies, ...p.devDependencies }; d['@playwright/test'] || d.playwright || ''")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache the browsers
        if: steps.playwright.outputs.version != ''
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # The runner's default Ubuntu mirror has served the browsers' system packages at under
      # 100 kB/s while Canonical's own archive was fast.
      - name: Use the Ubuntu archive for system packages
        if: steps.playwright.outputs.version != ''
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf 'http://archive.ubuntu.com/ubuntu/\tpriority:1\nhttp://azure.archive.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt
          fi

      - name: Install the browsers
        if: steps.playwright.outputs.version != ''
        timeout-minutes: 20
        run: pnpm --dir "kition-$KIT/web" exec playwright install --with-deps chromium webkit

      - name: pnpm run ${{ matrix.script }}
        env:
          DIR: ${{ matrix.dir }}
          SCRIPT: ${{ matrix.script }}
        run: pnpm --dir "kition-$KIT/$DIR" run "$SCRIPT"

      - name: Upload the evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-${{ matrix.slug }}
          path: |
            kition-${{ inputs.kit }}/web/test-results/
            kition-${{ inputs.kit }}/web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
