name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer without the v prefix
        required: true
        type: string
      source_ref:
        description: Public client ref to release
        required: true
        default: main
        type: string

permissions:
  contents: write

env:
  PNPM_VERSION: 10.33.0
  NODE_VERSION: '22.19.0'

concurrency:
  group: prepare-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify:
    name: Full suite before tagging
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout public client source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          lfs: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Static checks, build, and unit tests
        run: pnpm run check

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Every e2e spec is run somewhere
        run: pnpm run check:e2e-coverage

      - name: Run every mock-backed renderer and desktop end-to-end spec
        run: xvfb-run -a pnpm run test:e2e:ci

  prepare:
    runs-on: ubuntu-latest
    environment: release
    needs: verify
    steps:
      - name: Checkout public client source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Validate version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid SemVer: $INPUT_VERSION" >&2
            exit 1
          fi
          node <<'NODE'
          const fs = require('node:fs')
          const version = process.env.INPUT_VERSION
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          if (pkg.version !== version) throw new Error(`package version ${pkg.version} does not match ${version}`)
          NODE
          echo "tag=v$INPUT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Create or validate immutable release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch origin --tags --force
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            tagged_commit="$(git rev-list -n 1 "$TAG")"
            if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
              echo "Tag $TAG points to $tagged_commit instead of $GITHUB_SHA" >&2
              exit 1
            fi
          else
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/$TAG" \
              -f "sha=$GITHUB_SHA"
          fi

      - name: Create or validate draft Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            releases_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
            draft="$(jq -e -r --arg tag "$TAG" '
              map(select(.tag_name == $tag))
              | if length == 1 then (.[0].draft | tostring) else empty end
            ' <<<"$releases_json")"
            if [[ "$draft" != "true" ]]; then
              echo "Release $TAG is already published; tags are immutable" >&2
              exit 1
            fi
          else
            gh release create "$TAG" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "Kition ${TAG#v}" \
              --generate-notes
          fi

      - name: Report next step
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          echo "The installer draft for $TAG is prepared. Dispatch Publish Release to build and publish the installers."
