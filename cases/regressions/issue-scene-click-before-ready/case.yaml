format: 1
id: regressions/issue-scene-click-before-ready
feature: kition.platform.release-checks
intent: >-
  Kition's Scene test selects the cube only once the kit's viewport is ready (`data-ready`, which
  takes no pointer input before) and sees the cube selected in the outliner before it duplicates,
  so the saved scene holds Cube.001 and never a copy of the object selected before the click.
