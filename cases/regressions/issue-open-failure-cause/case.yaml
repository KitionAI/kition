id: regressions/issue-open-failure-cause
feature: kition.shell.error-states
intent: >-
  A file that cannot open is called damaged only when the file is at fault: when Kition's file
  service does not answer or the kit's editor engine cannot load, the notice says so and that the
  file is unchanged, and Try again opens it once the cause is gone. The raw reason stays under
  Technical details; the notice used to call such files damaged and show the raw error.
