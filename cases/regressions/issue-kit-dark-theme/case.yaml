format: 1
id: regressions/issue-kit-dark-theme
feature: kition.kit-protocol.theme
intent: >-
  An open kit takes Kition's scheme and the theme tokens Kition's stylesheet gives it, and each
  switch between light and dark reaches it as `ui/theme` (Kit UI protocol section 4, UI-H6);
  before, every kit editor stayed white in dark mode because the host sent a fixed light theme once.
