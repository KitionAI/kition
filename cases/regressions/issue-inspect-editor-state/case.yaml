intent: >-
  The in-page agent bridge handed the agent a kit's whole inspect() as the document, editor state
  included (cad's view, which follows the canvas), and the draft check of
  e2e/interaction/agent-adaptation.spec.ts failed for cad when the draft bar resized it. The agent
