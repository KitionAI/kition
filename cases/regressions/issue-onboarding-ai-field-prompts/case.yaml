format: 1
id: regressions/issue-onboarding-ai-field-prompts
feature: kition.onboarding.ai-fields
intent: >-
  The onboarding AI fields send the model the row they describe: Reading Tracker's AI Summary names
  the article's title and link, and Product Content Studio's LinkedIn and Twitter copy name the
  concept and its brief. The seeded prompts had no {{field}} placeholders, so the model saw only
  the instruction and could not summarize or write about the selected row.
