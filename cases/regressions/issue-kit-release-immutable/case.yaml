format: 1
id: regressions/issue-kit-release-immutable
feature: kition.kits.headless-archives
intent: >-
  On kit repositories with GitHub's immutable releases (kition-table, kition-note) the Package run
  failed with HTTP 422 "Cannot upload assets to an immutable release": the package job published
  the package-v<version> Release before the headless archives existed, so no archive or fragment
  could be added, and a published immutable Release that lacks them was planned for a build that
  could only fail. A new version's Release is now a draft that gains its package, archives and
  fragment and is published only once it holds every asset; a draft is filled again by a re-run
  (its package files remade only when it lacks one, platforms already in it counted as built, and
  built from the commit it targets); and a published immutable Release that lacks an archive or
  the fragment is refused at plan time, saying it cannot gain assets and the version must be bumped.
layer: gate
source:
  kind: issue
  from: "kit packaging runs 2026-11-18: kition-table and kition-note Package runs fail with HTTP 422 Cannot upload assets to an immutable release"
  license: owned
input: []
steps:
  - exec:
      cmd: [pnpm, exec, vitest, run, --config, tooling/vitest.config.ts, scripts/lib/kitReleaseAssets.spec.ts, -t, "draft and immutable Releases"]
expected:
  - actual: out:exec
    compare: exit
    value: 0
since: "2026-11-18"
