format: 1
id: kition.kits.host-names-no-kit/list
feature: kition.kits.host-names-no-kit
intent: >-
  Kition knows a kit by its manifest and the Kit protocols only. The check reads the kit names
  from the kits lock file and finds, in Kition's own source, a kit id in quotes (`kit.table`), a
  kit's own extension as a word (`ktable`), and a kit's engine (`kition_table_kit`, a quoted
  `TableDocument`). It leaves alone other words (`table`), another library's type of the same name
  (PdfDocument), comment lines, tests (spec files, test folders, a Rust file from its
  `#[cfg(test)]` line on), the locale files and generated code. Any match fails the check. Then
  the check itself runs on this repository and passes: no place in Kition's own code names a kit.
layer: gate
source:
  kind: synthetic
  from: scripts/check-kit-neutral.mjs
  license: owned
input: []
steps:
  - exec:
      cmd: [pnpm, exec, vitest, run, --config, tooling/vitest.config.ts, scripts/check-kit-neutral.spec.ts]
  - exec:
      cmd: [node, scripts/check-kit-neutral.mjs]
expected:
  - actual: out:exec
    compare: exit
    value: 0
since: "2026-11-22"
