format: 1
id: kition.kits.npm-lock/entry-format
feature: kition.kits.npm-lock
intent: >-
  A kits/kits.lock.json npm pin is { scope, version, commit, sdkCommit, tesseraCommit, fontsCommit,
  editor: { integrity, size }, platforms: { <platform>: { integrity, size } } }, its package names
  derived from the kit and the scope. Pinning the real registry metadata of @kitionstage note 0.1.5
  (five platforms) and html 0.1.3 (darwin-arm64 only, the others named as missing) downloads each
  tarball, refuses bytes that are not npm's integrity, and fails rather than leave out a platform a
  registry could not be asked about; reading refuses a pin without an integrity, a size, a known
  platform, a valid scope, or one naming a kit like another package of the scope; fetching checks
  integrity and size, the editor's package.json and kit-ui.json before replacing public/kits/<kit>-ui,
  and each platform package's name, platform, commit, kit.json and executable. A GitHub Release pin
  (repository, tag, asset, size, sha256) is still read, downloaded from GitHub and checked by size
  and SHA-256. Every registry and GitHub is a fake; no test reaches the network.
layer: gate
source:
  kind: synthetic
  from: scripts/lib/kitPackages.mjs
  license: owned
input: []
steps:
  - exec:
      cmd: [pnpm, exec, vitest, run, --config, tooling/vitest.config.ts, scripts/lib/kitPackages.spec.ts]
expected:
  - actual: out:exec
    compare: exit
    value: 0
since: "2026-11-21"
