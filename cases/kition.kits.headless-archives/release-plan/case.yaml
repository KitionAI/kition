format: 1
id: kition.kits.headless-archives/release-plan
feature: kition.kits.headless-archives
intent: >-
  From the asset names of a kit version's package-v<version> Release, a Package run publishes the
  package only when there is no Release, refuses a Release with only one of the package and its
  lock entry, builds only the platforms whose headless archive is missing (on the runners, targets
  and glibc 2.17 floor of kition-sdk's release), uploads only the archives the Release lacks, never
  one it has, and names every platform that built nothing; so running Package again on a released
  version adds the missing headless archives and fragment without touching the package.
layer: gate
source:
  kind: synthetic
  from: scripts/lib/kitReleaseAssets.mjs
  license: owned
input: []
steps:
  - exec:
      cmd: [pnpm, exec, vitest, run, --config, tooling/vitest.config.ts, scripts/lib/kitReleaseAssets.spec.ts, -t, "releasePlan|headlessMatrix|publishPlan|GITHUB_OUTPUT"]
expected:
  - actual: out:exec
    compare: exit
    value: 0
since: "2026-11-18"
