# Copied from kition-sdk crates/kition-license by scripts/sync-kit-host.mjs; change it there, not here.
[package]
name = "kition-license"
description = "Offline Kition SDK licence keys: an Ed25519-signed JSON payload, verified against pinned public keys with no network."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "2.2", default-features = false }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
