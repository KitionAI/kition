# Copied from kition-sdk crates/kition-kdm by scripts/sync-kit-host.mjs; change it there, not here.
[package]
name = "kition-kdm"
description = "Kit Data Model: the typed, replicated document model every Kition kit declares its document in."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Loro from KitionPkg/loro, branch `kition`: upstream Loro 1.16 without the MPL-2.0 `im`
# crate. The rev pins loro-internal too (a path dependency inside that repository).
loro = { git = "https://github.com/KitionPkg/loro", rev = "b7e6dfea82ac7dc4f5dcce282844911fba6d5c04" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }
uuid = { version = "1", features = ["v4", "v7"] }

[features]
# Counted ids for tests and sample builds (src/ids.rs, `KITION_REPRODUCIBLE_IDS`): a kit enables it in
# `[dev-dependencies]` only, never in a shipped build.
reproducible-ids = []

[dev-dependencies]
# The crate's own tests count ids when they ask for it (tests/reproducible_ids.rs).
kition-kdm = { path = ".", features = ["reproducible-ids"] }

# Browsers have no OS randomness: ids draw theirs from `crypto.getRandomValues`.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
uuid = { version = "1", features = ["js"] }
