# Copied from kition-sdk crates/kition-kdm by scripts/sync-kit-host.mjs; change it there, not here.
[package]
name = "kition-kdm"
description = "Kit Data Model: the typed, replicated document model every Kition kit declares its document in."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
# `float_roundtrip`: a number the content encoding writes reads back as the same double, so a
# file read and written again keeps its bytes (data model, "The content encoding").
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = { workspace = true }
uuid = { version = "1", features = ["v4", "v7"] }

[features]
# Counted ids for tests and sample builds (src/ids.rs, `KITION_REPRODUCIBLE_IDS`): a kit enables it in
# `[dev-dependencies]` only, never in a shipped build.
reproducible-ids = []

[dev-dependencies]
# The crate's own tests count ids when they ask for it (tests/reproducible_ids.rs).
kition-kdm = { path = ".", features = ["reproducible-ids"] }
# A global allocator that counts the heap bytes in use, and (`stats`) their peak: tests/bulk_undo_memory.rs
# measures the memory an undo keeps with it, tests/large_*.rs what loading and saving a large document
# hold (a test cannot implement `GlobalAlloc`: the lints forbid `unsafe`).
cap = { version = "0.1.2", features = ["stats"] }

# Browsers have no OS randomness: ids draw theirs from `crypto.getRandomValues`.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
uuid = { version = "1", features = ["js"] }
