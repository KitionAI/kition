[package]
name = "kition-kits"
description = "Installed kits inside the runtime: launching them, opening workspace files, and the /kits HTTP API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
kition-core = { workspace = true }
kition-http = { workspace = true }
kition-kdm = { workspace = true }
kition-kit-host = { workspace = true }
kition-kit-protocol = { workspace = true, features = ["tokio"] }

axum = { workspace = true }
base64 = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-std", "io-util"] }
tokio-stream = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[[bin]]
name = "kition-kits-mcp"
path = "src/bin/kition-kits-mcp.rs"

[dev-dependencies]
http-body-util = { workspace = true }
jsonschema = { workspace = true }
kition-store = { workspace = true }
tempfile = { workspace = true }
tower = { workspace = true }
