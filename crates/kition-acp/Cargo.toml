[package]
name = "kition-acp"
description = "Kition's agent over the Agent Client Protocol: a stdio ACP server that editors launch, driving the running runtime's agent."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
clap = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync"] }

[[bin]]
name = "kition-acp"
path = "src/bin/kition-acp.rs"

[dev-dependencies]
axum = { workspace = true }
kition-http = { workspace = true }
