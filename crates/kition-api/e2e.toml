[app]
name = "Kition Desktop API E2E"
version = "2.0.0-e2e"
apiPrefix = "/api/v1"
jwtSecret = "e2e-secret"
disableAuth = true
e2eTestMode = true
accessTokenExpireMinutes = 120
refreshTokenExpireDays = 7
autoMigrate = true
autoSeed = true

[portal]
baseURL = "https://kition.ai"

[server]
  [server.http]
    port = 18101

[sqlite]
path = "./data/desktop-e2e.db"

[storage]
uploadDir = "./test-uploads-desktop"
workspaceDir = "./test-workspace-desktop"

[logger.default]
writer = "stderr"
async = false
level = "error"
